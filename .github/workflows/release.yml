name: Release

on:
  push:
    tags:
      - 'v*'

# Windows-only release workflow — produces .msi + .exe artifacts for the
# Captain's teammates to install. macOS builds are produced locally on the
# Captain's workstation (npm run tauri:build) so we don't need a CI runner
# for that. Linux is omitted entirely.
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build (Tauri)
        uses: tauri-apps/tauri-action@v0.5.21
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Command Auspex ${{ github.ref_name }}'
          releaseBody: |
            Command Auspex — Windows desktop build.

            **First launch:** Windows SmartScreen will warn "Windows protected your PC" — click **More info** → **Run anyway**. The app is unsigned (no EV cert yet); this is expected.

            **Install options:**
            - `.msi` — Windows Installer, recommended.
            - `.exe` — NSIS-style setup, lighter weight.

            Either installer drops the app under `Program Files` and adds a Start Menu entry.
          releaseDraft: false
          prerelease: false
