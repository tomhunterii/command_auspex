name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-24.04
            target: ''
            rust_targets: ''
          - platform: windows-latest
            target: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build (Tauri)
        uses: tauri-apps/tauri-action@v0.5.21
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Command Auspex ${{ github.ref_name }}'
          releaseBody: |
            Command Auspex desktop build.

            **First launch (macOS):** right-click the app → Open → confirm "Open Anyway".
            **First launch (Windows):** SmartScreen warning → "More info" → "Run anyway".
            **First launch (Linux):** `chmod +x` the AppImage, then run.

            Unsigned binaries; Gatekeeper / SmartScreen warnings are expected.
          releaseDraft: false
          prerelease: false
