[package]
name = "command-auspex"
version = "0.1.14"
description = "Command Auspex — list-building battle simulator"
authors = ["Tom Hunter"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "command_auspex"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Catalogue builder dependencies — port of scripts/build-catalogue.js. The
# DB is rebuilt from <app_data>/datasheets/ + <app_data>/missions/ on every
# launch; rusqlite gets the bundled-sqlite feature so cross-compilation
# doesn't require a system libsqlite. See src/catalogue/mod.rs.
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1.10"
walkdir = "2.5"
once_cell = "1.19"
thiserror = "1"
# HTTPS client for on-launch sync against raw.githubusercontent.com.
# Blocking (sync) — fine because sync runs once in setup(), before window.
ureq = { version = "2", features = ["tls"] }
sha2 = "0.10"

[dev-dependencies]
# Integration tests live in src-tauri/tests/ and build a catalogue against
# the repo's actual datasheets/ tree (path resolved via CARGO_MANIFEST_DIR).
tempfile = "3"
# In-process HTTP server for sync_test.rs.
tiny_http = "0.12"

[[bin]]
# CLI entrypoint that builds the catalogue from a given input dir without
# the Tauri runtime — used by CI to diff against the JS builder's output
# and by `cargo test` integration tests.
name = "catalogue-build"
path = "src/bin/catalogue_build.rs"

[[bin]]
name = "command-auspex"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
